name: MaceControl
version: ${project.version}
main: dev.macecontrol.MaceControl
api-version: '1.21'
description: >
  Full control over Mace base damage, smash-attack fall-damage scaling,
  Density bonus per block, and Breach armor-penetration percentage.
  Compatible with Paper 1.21.11.
authors:
  - vulgarmc
  - Lostgalaxy
commands:
  macecontrol:
    description: Reloads the MaceControl configuration.
    usage: /macecontrol reload
    permission: macecontrol.reload

permissions:
  macecontrol.reload:
    description: Allows reloading the MaceControl config in-game.
    default: op
