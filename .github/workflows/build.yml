name: Build MaceControl

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  release:
    types: [ published ]

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repository ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 21 (required by Paper 1.21.11) ───────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ── 3. Build with Maven ──────────────────────────────────────────────────
      - name: Build with Maven
        run: mvn package --no-transfer-progress

      # ── 4. Rename JAR to a clean predictable filename ────────────────────────
      - name: Rename JAR to clean filename
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          cp target/MaceControl-*.jar target/MaceControl-${VERSION}.jar
          echo "JAR_NAME=MaceControl-${VERSION}.jar" >> $GITHUB_ENV

      # ── 5. Upload artifact ───────────────────────────────────────────────────
      #
      #  NOTE: GitHub always wraps artifacts in a zip — this cannot be changed.
      #  The zip will only contain one file inside: MaceControl-X.X.X.jar
      #  To get a raw JAR with NO unzipping needed, use either:
      #
      #    A) Releases page (best for distribution):
      #       Go to Releases → Draft a new release → publish.
      #       The JAR attaches as a direct download with no zip.
      #
      #    B) nightly.link (best for dev/test builds):
      #       https://nightly.link/chinpatakdamdampro-web/MaceControl/workflows/build/main
      #       Every build here downloads as a plain .jar — bookmark this.
      #
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JAR_NAME }}
          path: target/${{ env.JAR_NAME }}
          if-no-files-found: error

      # ── 6. Attach raw JAR to GitHub Release (no zip, direct download) ────────
      - name: Attach JAR to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ env.JAR_NAME }}
